params {
    slurm_account = System.getenv('SLURM_JOB_ACCOUNT') ?: System.getenv('SBATCH_ACCOUNT') ?: ''
    memory_per_job = 128.GB
    // Cellpose-SAM 3D can need far more working memory than the raw image bytes.
    // Keep automatic VIB chunks small while requesting enough host RAM per GPU job.
    substack_memory_fraction = 0.015625
    combine_memory = 192.GB
    combine_max_memory = 512.GB
    combine_time = 1.h
    combine_postprocess_time = 4.h
}

process {
    executor = 'slurm'
    clusterOptions = { params.slurm_account ? "--account=${params.slurm_account}" : '' }

    cache = 'lenient'
    debug = true
    ext.condaDir = 'cuda'

    beforeScript = '''
        unset LD_PRELOAD
        export CONDA_NO_PLUGINS=true
        export MAMBA_ROOT="/mnt/modules/easybuild/software/Mamba/23.11.0-0"
        export PATH="$MAMBA_ROOT:$MAMBA_ROOT/sbin:$MAMBA_ROOT/bin:$PATH"
    '''

    errorStrategy = { task.exitStatus in (130..145) || task.exitStatus in [104, 175] ? 'retry' : 'terminate' }
    maxRetries = 3
    maxErrors = '-1'

    cpus = { 1 * task.attempt }
    
    memory = {
        if (task.attempt == 1)      128.GB
        else if (task.attempt == 2) 192.GB
        else                        256.GB
    }

    time = { 4.h * task.attempt }

    queue = 'hmem_128C_256T_2TB'

    // Keep artifact cache handling in the parent Nextflow allocation. This
    // avoids Slurm/storeDir output collection crossing the container boundary.
    withName: downloadArtifact {
        executor = 'local'
    }

    withName: combineStacks {
        // Final RLE encoding is CPU/RAM-bound and can outlive tile inference.
        // Keep it comfortably below half of a 2 TB node, even on retries.
        memory = { task.attempt == 1 ? params.combine_memory : params.combine_max_memory }
        time = { (params.postprocess ? params.combine_postprocess_time : params.combine_time) * task.attempt }
    }

    withLabel: gpu_process {
        clusterOptions = {
            def opts = []
            if (params.slurm_account) opts << "--account=${params.slurm_account}"
            opts << "--gres=gpu:1"
            opts.join(' ')
        }

        queue = 'gpu_h100_64C_128T_2TB'
        maxForks = 7
        cpus = { 4 * task.attempt }
        memory = { params.memory_per_job * task.attempt }
        time = { 30.min * task.attempt }
    }
}

executor {
    $slurm {
        // Large RLE outputs can take time to become visible over NFS after
        // Slurm drops a completed job from squeue. The previous 15-minute
        // timeout raced the .exitcode file even though Slurm recorded exit 0.
        exitReadTimeout = '30 min'
    }
}


conda {
    enabled = true
    cacheDir = "${params.root_dir}/conda/"
    createTimeout = '1h'
    useMamba = true
}
