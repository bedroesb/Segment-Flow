params {
    slurm_account = System.getenv('SLURM_JOB_ACCOUNT') ?: System.getenv('SBATCH_ACCOUNT') ?: ''
}

process {
    executor = 'slurm'
    clusterOptions = { params.slurm_account ? "--account=${params.slurm_account}" : '' }

    cache = 'lenient'
    debug = true
    ext.condaDir = 'cuda'

    beforeScript = '''
        unset LD_PRELOAD
        export CONDA_NO_PLUGINS=true
        export MAMBA_ROOT="/mnt/modules/easybuild/software/Mamba/23.11.0-0"
        export PATH="$MAMBA_ROOT:$MAMBA_ROOT/sbin:$MAMBA_ROOT/bin:$PATH"
    '''

    errorStrategy = { task.exitStatus in (130..145) || task.exitStatus in [104, 175] ? 'retry' : 'terminate' }
    maxRetries = 3
    maxErrors = '-1'

    cpus = { 1 * task.attempt }
    memory = { 6.GB * task.attempt }
    time = { 4.h * task.attempt }

    queue = 'hmem_128C_256T_2TB'

    withLabel: gpu_process {
        clusterOptions = {
            def opts = []
            if (params.slurm_account) opts << "--account=${params.slurm_account}"
            opts << "--gres=gpu:1"
            opts.join(' ')
        }

        queue = 'gpu_h100_64C_128T_2TB'
        cpus = { 4 * task.attempt }
        memory = { 32.GB * task.attempt }
        time = { 30.min * task.attempt }
    }
}

executor {
    $slurm {
        exitReadTimeout = '15 min'
    }
}


conda {
    enabled = true
    cacheDir = "${params.root_dir}/conda/"
    createTimeout = '1h'
    useMamba = true
}

